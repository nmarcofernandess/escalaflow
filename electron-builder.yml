appId: com.escalaflow.desktop
productName: EscalaFlow
directories:
  buildResources: resources
  output: dist
files:
  - 'out/**/*'
extraResources:
  - from: 'solver-bin/'
    to: 'solver-bin/'
    filter:
      - '**/*'
  - from: 'models/'
    to: 'models/'
    filter:
      - '**/*'
  - from: 'knowledge/'
    to: 'knowledge/'
    filter:
      - '**/*.md'
      - '**/*.json'
  - from: 'mcp-bin/'
    to: 'mcp-bin/'
    filter:
      - '**/*'
  - from: 'stt-bin/'
    to: 'stt-bin/'
    filter:
      - '**/*'
  - from: 'llama.cpp/'
    to: 'llama.cpp/'
    filter:
      - '**/*'
asarUnpack:
  - '**/*.node'
  - 'node_modules/node-llama-cpp/**/*'
mac:
  icon: icon.icns
  category: public.app-category.business
  type: distribution
  forceCodeSigning: true
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  binaries:
    - Contents/Resources/solver-bin/escalaflow-solver
    - Contents/Resources/stt-bin/escalaflow-stt
    - Contents/Resources/mcp-bin/escalaflow-mcp
    - Contents/Resources/llama.cpp/darwin-arm64/llama-server
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: '${productName}-${version}-${arch}.${ext}'
  notarize: true
  publish:
    provider: github
    owner: nmarcofernandess
    repo: escalaflow
    channel: signed
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: '/Applications'
    - x: 270
      y: 80
      type: file
      path: 'resources/LEIA ANTES DE INSTALAR.txt'
win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: '${productName}-Setup-${version}.${ext}'
linux:
  icon: icon.png
  target:
    - AppImage
  category: Office
  artifactName: '${productName}-${version}.${ext}'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
publish:
  provider: github
  owner: nmarcofernandess
  repo: escalaflow
